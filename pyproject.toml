    "torch",
    "torchvision",
    "open3d",
    "hydra-core",
    "mobile_sam@git+https://github.com/ChaoningZhang/MobileSAM.git",
    "open_clip_torch",
    "ultralytics",
    "openai",
    "google-genai",
